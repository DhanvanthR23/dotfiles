# ~/.config/foot/foot.ini
# Tokyo Night Storm — foot 1.23+ compatible

[main]
term=foot
font=JetBrainsMono Nerd Font:size=11
font-bold=JetBrainsMono Nerd Font:weight=bold:size=11
dpi-aware=no
pad=10x8
resize-delay-ms=100

[scrollback]
lines=5000
multiplier=3.0

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
osc8-underline=url-mode

[cursor]
style=beam
blink=yes
blink-rate=500

[mouse]
hide-when-typing=yes

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+r

[colors-dark]
# cursor: foreground background
cursor=1f2335 7aa2f7

background=1f2335
foreground=c0caf5

selection-foreground=c0caf5
selection-background=283457

# normal 0-7
regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6

# bright 8-15
bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5

# dim
dim0=0d0e16
dim1=914158
dim2=485e30
dim3=8a6832
dim4=2e4d95
dim5=735cad
dim6=4d8fa6
dim7=737aa2
