<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="font">
    <test name="family"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="fontfeatures" mode="append">
      <string>calt off</string>
      <string>liga off</string>
    </edit>
  </match>
</fontconfig>
