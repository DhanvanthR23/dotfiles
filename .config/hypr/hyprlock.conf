# ~/.config/hypr/hyprlock.conf
# Rosé Pine — GPU-accelerated, niri-compatible

source = ~/.config/colors/colors-hypr.conf

general {
  disable_loading_bar = true
  hide_cursor = true
  grace = 0
  no_fade_in = false
  no_fade_out = false
}

background {
  monitor =
  path = screenshot
  blur_passes = 2
  blur_size = 4
  noise = 0.05
  contrast = 1.0
  brightness = 0.7
  vibrancy = 0.2
  vibrancy_darkness = 0.2
}

input-field {
  monitor =
  size = 220, 44
  outline_thickness = 2
  dots_size = 0.25
  dots_spacing = 0.2
  dots_center = true
  outer_color = $border_color
  inner_color = $bg_color
  font_color = $text_color
  fade_on_empty = true
  fade_timeout = 1000
  placeholder_text = 
  rounding = 8
  check_color = $accent_color
  fail_color = $fail_color
  fail_text = 
  fail_transition = 300
  capslock_color = $warning_color
  position = 0, -80
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
  color = $text_color
  font_size = 64
  font_family = JetBrainsMono Nerd Font
  position = 0, 100
  halign = center
  valign = center
  shadow_passes = 1
  shadow_size = 4
  shadow_color = $shadow_color
}

label {
  monitor =
  text = cmd[update:60000] echo "$(date +'%A, %d %B')"
  color = $dim_color
  font_size = 16
  font_family = JetBrainsMono Nerd Font
  position = 0, 30
  halign = center
  valign = center
  shadow_passes = 1
  shadow_size = 3
  shadow_color = $shadow_color
}
