# ~/.config/hypr/hyprlock.conf
# Tokyo Night Storm — GPU-accelerated, niri-compatible

general {
  disable_loading_bar = true
  hide_cursor = true
  grace = 0
  no_fade_in = false
  no_fade_out = false
}

background {
  monitor =
  path = screenshot
  blur_passes = 2
  blur_size = 4
  noise = 0.05
  contrast = 1.0
  brightness = 0.7
  vibrancy = 0.2
  vibrancy_darkness = 0.2
}

input-field {
  monitor =
  size = 220, 44
  outline_thickness = 2
  dots_size = 0.25
  dots_spacing = 0.2
  dots_center = true
  outer_color = rgb(3b4261)
  inner_color = rgb(1f2335)
  font_color = rgb(c0caf5)
  fade_on_empty = true
  fade_timeout = 1000
  placeholder_text = 
  rounding = 8
  check_color = rgb(7aa2f7)
  fail_color = rgb(f7768e)
  fail_text = 
  fail_transition = 300
  capslock_color = rgb(e0af68)
  position = 0, -80
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
  color = rgb(c0caf5)
  font_size = 64
  font_family = JetBrainsMono Nerd Font
  position = 0, 100
  halign = center
  valign = center
  shadow_passes = 1
  shadow_size = 4
  shadow_color = rgba(1f233588)
}

label {
  monitor =
  text = cmd[update:60000] echo "$(date +'%A, %d %B')"
  color = rgb(9aa5ce)
  font_size = 16
  font_family = JetBrainsMono Nerd Font
  position = 0, 30
  halign = center
  valign = center
  shadow_passes = 1
  shadow_size = 3
  shadow_color = rgba(1f233588)
}
