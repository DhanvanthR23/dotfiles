# ~/.config/fuzzel/fuzzel.ini
# Tokyo Night Storm — fast, minimal, no icons for speed on i915

[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=auto
prompt=  
placeholder=launch...
lines=10
width=35
horizontal-pad=16
vertical-pad=10
inner-pad=6
x-margin=0
y-margin=0
anchor=top
# icons disabled — speeds up launch significantly on slow GPUs (Intel HD 5500)
icons-enabled=false
# dmenu mode support (used by cliphist)
terminal=foot

[colors]
# format: rrggbbaa
background=1f2335ff
text=c0caf5ff
match=7aa2f7ff
selection=292e42ff
selection-text=c0caf5ff
selection-match=7dcfffff
border=3b4261ff
prompt=bb9af7ff
placeholder=9aa5ce88
input=c0caf5ff

[border]
width=1
radius=8

[dmenu]
# extra newline exit = true makes fuzzel close on empty enter
exit-immediately-if-empty=yes
