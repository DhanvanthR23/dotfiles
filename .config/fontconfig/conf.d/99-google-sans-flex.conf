<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ~/.config/fontconfig/conf.d/99-google-sans-flex.conf
  Sets Google Sans Flex as default sans-serif for UI apps.
  JetBrainsMono Nerd Font stays as monospace.
  Waybar/Mako define their own font-family explicitly, so this won't touch them.
-->
<fontconfig>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Google Sans Flex</family>
    </prefer>
  </alias>

  <alias>
    <family>sans</family>
    <prefer>
      <family>Google Sans Flex</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>

  <!-- Rendering: subpixel RGB, slight hinting — tuned for 1366x768 TN -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

</fontconfig>
