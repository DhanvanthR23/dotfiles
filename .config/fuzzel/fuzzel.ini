# ~/.config/fuzzel/fuzzel.ini
# Rosé Pine — fast, minimal, no icons for speed on i915

[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
prompt=  
placeholder=launch...
lines=10
width=35
horizontal-pad=16
vertical-pad=10
inner-pad=6
x-margin=0
y-margin=0
anchor=top
# icons disabled — speeds up launch significantly on slow GPUs (Intel HD 5500)
icons-enabled=false
# dmenu mode support (used by cliphist)
terminal=foot
include=~/.config/colors/colors-fuzzel.ini

[border]
width=1
radius=8

[dmenu]
# extra newline exit = true makes fuzzel close on empty enter
exit-immediately-if-empty=yes
